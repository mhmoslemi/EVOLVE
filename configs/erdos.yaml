engine: evolve
schema_version: 1
problem: erdos
target: 0.380876
budget_s: 100
eval_cpus: 10
num_seed_states: 8
sandbox_timeout_s: 120

model_name: Qwen/Qwen3-8B
backend: hf
generation_backend: hf
max_seq_length: 32000
max_new_tokens: 30000
temperature: 1.0
top_p: 1.0
learning_rate: 4.0e-5
