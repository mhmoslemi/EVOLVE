# NVIDIA H100 MLA-decode kernel search. `problems/gpu_mode.py` verifies saved
# kernels independently and records repeated benchmark evidence conservatively.
engine: evolve
schema_version: 1
problem: gpu_mode
problem_type: mla_decode_nvidia

# Benchmark/verifier layer.
gpu_type: H100
score_scale: 5000
target: 1700
task_yaml: examples/gpu_mode/lib/mla-decode/task.yml
lib_dir: examples/gpu_mode/lib
num_seed_states: 8
sandbox_timeout_s: 1300
kernel_timeout_s: 1200
reward_workers: 1       # Benchmark GPU is exclusive; verification stays serial.
kernel_gpu_id: 6        # LAST GPU: evaluation only; generation cannot see it.
kernel_eval_isolation: true

# Frozen backbone and isolated role-LoRAs.
model_name: unsloth/gpt-oss-120b
backend: unsloth
generation_backend: vllm
max_seq_length: 32000
max_new_tokens: 26000
temperature: 1.0
top_p: 1.0
load_in_4bit: true  # Unsloth training only; never forwarded to vLLM.
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
learning_rate: 4.0e-5
kl_penalty_coef: 0.1
gen_micro_batch: 1

# GPUs 0-3 form ONE supported TP=4 gpt-oss engine and host Unsloth learning.
# GPUs 4-5 are deliberately idle. GPU 6 is exclusively leased to evaluation.
# TP=6/7 would not divide gpt-oss's 64 attention heads and is rejected.
gpu_ids: [0, 1, 2, 3]
num_gpus: 4
vllm_tensor_parallel_size: 4
vllm_quantization: auto  # Native GPT-OSS MXFP4; unrelated to training QLoRA.
vllm_gpu_memory_utilization: 0.85
vllm_max_num_seqs: 4
vllm_max_num_batched_tokens: 8192
vllm_cpu_offload_gb: 0
vllm_swap_space_gb: 4
vllm_enforce_eager: true
vllm_enable_prefix_caching: true
vllm_fully_sharded_loras: true
seed: 42
deterministic: false

evolve:
  # Epoch/verifier budget plus paired option, refinement, and harness evidence.
  budget:
    epochs: 50
    verifier_calls: 5000
    audit_fraction: 0.15
    refinement_fraction: 0.05
  archive:
    elites_per_cell: 3
    empty_cell_fraction: 0.10
  roles:
    enabled: [scout, mechanist, challenger]
  # Kernel branches are kept shorter because each independent verification is costly.
  options:
    max_horizon: 3
    branch_budget: 24
  harnesses:
    trial_fraction: 0.05
    active_versions: [baseline_v1]
  scheduler:
    posterior: zero_inflated_tail
    global_exploration_fraction: 0.10
  audits:
    no_memory_fraction: 0.05
    min_pairs_for_promotion: 5
  # Smaller homogeneous groups reduce expensive benchmark demand.
  learning:
    objective: ordergrad
    top_m: 1
    group_k: 4
  refinement:
    max_attempts: 3
    max_depth: 2
  reporting:
    status_every_verifications: 10
    plots_every_epochs: 1
  # K=4 plus three paired reservation channels and all-role coverage.
  workers:
    max_inflight_branches: 12
